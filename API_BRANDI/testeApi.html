<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste de Requisições</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>C.R.U.D. padrão API</h1>

    Id <input type="text" id="id" name="id" value="0" size="3" readonly /><br /><br />
    Nome <input type="text" id="nome" name="nome" value="" size="35" /><br /><br />
    Descrição <input type="text" id="categoria" name="categoria" value="" size="20" /><br /><br />
    Preço Venda <input type="text" id="preco" name="preco" value="" size="20" /><br /><br />
    Preço Custo <input type="text" id="pc" name="pc" value="" size="20" /><br /><br />
    Lucro <input type="text" id="lc" name="cc" value="" size="20" /><br /><br />
    Quantidade em Estoque <input type="text" id="qe" name="qe" value="" size="20" /><br /><br />
    Categoria <input type="text" id="c" name="c" value="" size="20" /><br /><br />

    <button onclick="get()">GET (Consulta/Lista)</button>
    <button onclick="post()">POST (Cadastrar)</button>
    <button onclick="put()">PUT (Alterar)</button>
    <button onclick="del()">DELETE (Excluir)</button>
    <div id="table-container"></div>

    <script>
        async function get() {
            try {
                const response = await fetch("http://localhost/api/testeApi.php/cliente/list", {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                    },
                });
                const data = await response.json();

                let tableHtml = "<table><thead><tr><th>ID</th><th>Nome do Produto</th><th>Descrição</th><th>Preco Venda</th><th>Preco Custo</th><th>Lucra</th><th>Quantidade em Estoque</th><th>Categoria</th></tr></thead><tbody>";
                data.forEach((item) => {
                    tableHtml += `<tr onclick='selectRow(${item.id}, "${item.nome}", "${item.categoria}", "${item.preco}", "${item.pc}", "${item.lc}", "${item.qe}", "${item.c}")'>`;
                    tableHtml += `<td>${item.id}</td>`;
                    tableHtml += `<td>${item.nome}</td>`;
                    tableHtml += `<td>${item.categoria}</td>`;
                    tableHtml += `<td>${item.preco}</td>`;
                    tableHtml += `<td>${item.pc}</td>`;
                    tableHtml += `<td>${item.lc}</td>`;
                    tableHtml += `<td>${item.qe}</td>`;
                    tableHtml += `<td>${item.c}</td>`;
                    tableHtml += `</tr>`;
                });
                tableHtml += "</tbody></table>";

                document.getElementById("table-container").innerHTML = tableHtml;
            } catch (error) {
                console.error("Erro ao executar solicitação GET:", error);
            }
        }

        async function post() {
            try {
			    
                const response = await fetch("http://localhost/api/testeApi.php/cliente", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        nome: document.getElementById("nome").value,
                        categoria: document.getElementById("categoria").value,
                        preco: document.getElementById("preco").value,
                        pc: document.getElementById("pc").value,
                        lc: document.getElementById("lc").value,
                        qe: document.getElementById("qe").value,
                        c: document.getElementById("c").value,
                    }),
                });
                const data = await response.json();
                alert(JSON.stringify(data.message));
                get(); // Atualiza a tabela após adicionar
            } catch (error) {
                console.error("Erro ao executar solicitação POST:", error);
            }
        }

        window.onload = get;

        async function put() {
            try {
                const response = await fetch("http://localhost/api/testeApi.php/cliente/" + document.getElementById("id").value, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        nome: document.getElementById("nome").value,
                        categoria: document.getElementById("categoria").value,
                        preco: document.getElementById("preco").value,
                        pc: document.getElementById("pc").value,
                        lc: document.getElementById("lc").value,
                        qe: document.getElementById("qe").value,
                        c: document.getElementById("c").value,
                    }),
                });
                const data = await response.json();
                alert(JSON.stringify(data.message));
                get(); // Atualiza a tabela após editar
            } catch (error) {
                console.error("Erro ao executar solicitação PUT:", error);
            }
        }

        async function del() {
            try {
                const response = await fetch("http://localhost/api/testeApi.php/cliente/" + document.getElementById("id").value, {
                    method: "DELETE",
                });
                const data = await response.json();
                alert(JSON.stringify(data.message));
                get(); // Atualiza a tabela após excluir
            } catch (error) {
                console.error("Erro ao executar solicitação DELETE:", error);
            }
        }

        function selectRow(id, nome, categoria, preco, pc, lc, qe, c) {
            document.getElementById("id").value = id;
            document.getElementById("nome").value = nome;
            document.getElementById("categoria").value = categoria;
            document.getElementById("preco").value = preco;
            document.getElementById("pc").value = pc;
            document.getElementById("lc").value = lc;
            document.getElementById("qe").value = qe;
            document.getElementById("c").value = c;
        }
    </script>
</body>
</html>
